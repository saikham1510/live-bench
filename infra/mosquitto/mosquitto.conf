# Local development broker for Live Bench.
# Anonymous access is OK here only because compose.yaml publishes the port
# on 127.0.0.1 (this computer only). Plan for future is to add passwords before the ESP32 connects.

listener 1883
allow_anonymous true

# Keep retained messages (devices/+/status) across broker restarts.
persistence true
persistence_location /mosquitto/data/

# Log to the container output, so `docker compose logs` shows it.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S